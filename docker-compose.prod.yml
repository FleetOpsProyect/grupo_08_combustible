# Production environment of the Fuel service on AWS EC2, used by the CD pipeline (.github/workflows/cd.yml).
# Unlike docker-compose.yml, the service is not built here: it runs the image that the pipeline pushed
# to Docker Hub (FUEL_IMAGE). The database is PostgreSQL 16 on Neon (managed, outside the instance): DB_URL,
# DB_USER and DB_PASSWORD come from .env, with sslmode=require. WireMock stays internal.
# Monitoring (dojo Prometheus & Grafana): the instance only runs the exporters, on non-standard ports that the
# security group opens to the team IPs only. Prometheus and Grafana run on each developer's machine
# (monitoring/ec2/docker-compose.yml) and pull the metrics from here:
#   NODE_EXPORTER_PORT (19100) -> OS metrics    CADVISOR_PORT (18080) -> container metrics
#   MANAGEMENT_PORT (18001)    -> service metrics (/prometheus), apart from the API port
# The .env file is created once by hand on the instance (copy of .env.example with production values).

services:
  # [Archetype Convention Addition] Test double of G2 and G6 while they are not deployed.
  # When they are, set ASSIGNMENTS_BASE_URL_PROD and ROUTES_BASE_URL_PROD in .env and remove this service
  dependencies-mock:
    image: wiremock/wiremock:3.13.2-alpine
    volumes:
      - ./wiremock:/home/wiremock:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/__admin/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - fuel-net

  fuel-service:
    image: ${FUEL_IMAGE}
    env_file:
      - .env
    environment:
      ASSIGNMENTS_BASE_URL: ${ASSIGNMENTS_BASE_URL_PROD:-http://dependencies-mock:8080}
      ROUTES_BASE_URL: ${ROUTES_BASE_URL_PROD:-http://dependencies-mock:8080}
    ports:
      - "${APP_PORT}:${SERVER_PORT}"
      - "${MANAGEMENT_PORT}:${MANAGEMENT_PORT}"
    depends_on:
      dependencies-mock:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:$${SERVER_PORT}/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    networks:
      - fuel-net

  # Exporters of the monitoring dojo. Prometheus pulls them from outside every 15 s (pull model)
  node-exporter:
    image: prom/node-exporter:v1.9.1
    command:
      - --path.rootfs=/host
    pid: host
    volumes:
      - /:/host:ro,rslave
    ports:
      - "${NODE_EXPORTER_PORT}:9100"
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    # Only Docker containers and a slower housekeeping, so it stays light on the t3.micro
    command:
      - --docker_only=true
      - --housekeeping_interval=30s
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    ports:
      - "${CADVISOR_PORT}:8080"
    restart: unless-stopped

networks:
  fuel-net:
