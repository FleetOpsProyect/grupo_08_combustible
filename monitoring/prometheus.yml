# Prometheus scrapes the Micrometer endpoint of the Fuel service inside the compose network.
# 18001 is MANAGEMENT_PORT inside the container (see .env.example).
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: fuel-service
    metrics_path: /prometheus
    static_configs:
      - targets: ["fuel-service:18001"]
