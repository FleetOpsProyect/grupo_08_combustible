# Every environment-specific value comes from an environment variable (see .env.example).
# When the service runs from the IDE, the variables are read from the .env file of the project root;
# real environment variables (Docker, CI, EC2) always take precedence over that file.
spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: fleetops-fuel-service
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT}

# Health and metrics. Base path "/" so the shared contract paths are /health and /prometheus.
management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}
    # Histogram buckets so Grafana can show the p95 latency per endpoint
    distribution:
      percentiles-histogram:
        http.server.requests: true

# API documentation: OpenAPI JSON generated by springdoc, interactive reference by Scalar
springdoc:
  api-docs:
    path: /v3/api-docs
scalar:
  enabled: true
  url: /v3/api-docs
  page-title: FleetOps - Fuel service (G08)
  path: /scalar

# Structured JSON logs (includes correlation_id from the MDC)
logging:
  structured:
    format:
      console: ecs

fuel:
  time-zone: ${APP_TIME_ZONE}
  anomaly:
    threshold-percent: ${ANOMALY_THRESHOLD_PERCENT}
    minimum-samples: ${ANOMALY_MINIMUM_SAMPLES}
  outbox:
    relay-interval-ms: ${OUTBOX_RELAY_INTERVAL_MS}
    batch-size: ${OUTBOX_BATCH_SIZE}
  assignments:
    base-url: ${ASSIGNMENTS_BASE_URL}
    in-progress-state: ${ASSIGNMENT_IN_PROGRESS_STATE}
  routes:
    base-url: ${ROUTES_BASE_URL}
    in-progress-status: ${ROUTE_IN_PROGRESS_STATUS}
  http:
    timeout-ms: ${HTTP_TIMEOUT_MS}
  circuit-breaker:
    failure-rate-threshold: ${CB_FAILURE_RATE_THRESHOLD}
    sliding-window-size: ${CB_SLIDING_WINDOW_SIZE}
    minimum-calls: ${CB_MINIMUM_CALLS}
    wait-open-ms: ${CB_WAIT_OPEN_MS}
